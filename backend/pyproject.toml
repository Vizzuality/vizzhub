[project]
name = "vizzhub-backend"
version = "1.9.0"
description = "VizzHub — internal operations hub backend (FastAPI, ARQ, SQLAlchemy)."
requires-python = ">=3.13,<3.14"
dependencies = [
    # FastAPI and server
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    # Security
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "cryptography>=46.0.5,<48.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "itsdangerous>=2.1.0,<3.0.0",
    "google-auth>=2.27.0,<3.0.0",
    "google-auth-oauthlib>=1.2.0,<2.0.0",
    "google-api-python-client>=2.114.0,<3.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.25,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "greenlet>=3.0.0,<4.0.0",
    "alembic>=1.13.0,<2.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    # Validation and settings
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    # HTTP clients
    "httpx>=0.26.0,<1.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "requests>=2.31.0,<3.0.0",
    # Async job queue
    "arq>=0.25,<1.0.0",
    "redis>=5.0,<6.0.0",
    # Configuration
    "pyyaml>=6.0.1,<7.0.0",
    # Observability
    "structlog>=24.1.0,<26.0.0",
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0,<8.0.0",
    # Export
    "openpyxl>=3.1.0,<4.0.0",
    # Markdown rendering and templating (playbook static export)
    "markdown-it-py>=3.0.0,<4.0.0",
    "mdit-py-plugins>=0.4.0,<1.0.0",
    "linkify-it-py>=2.0.0,<3.0.0",
    "Jinja2>=3.1.0,<4.0.0",
    # AWS (S3 assets, CloudFront invalidations)
    "boto3>=1.34.0,<2.0.0",
    # MCP server (mounted as FastAPI extension in the same process)
    "mcp>=1.12.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "respx>=0.22.0,<1.0.0",
    "fakeredis>=2.0.0,<3.0.0",
    "black>=26.3.1,<28.0.0",
    "ruff>=0.2.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
# Rules ignored as baseline debt — existing violations carry forward;
# new code is still expected to comply. Tracked for boy-scout cleanup.
ignore = [
    "E402",   # module-import-not-at-top — intentional in some routers/tests
    "E501",   # line-too-long — formatter handles structural cases
    "E741",   # ambiguous-variable-name
    "B007",   # unused-loop-control-variable
    "B904",   # raise-without-from — false-positive prone in async/web wrappers
    "B905",   # zip-without-strict
    "UP042",  # str-enum-replacement — refactor backlog
    "F821",   # undefined-name — SQLAlchemy forward refs (migrate via TYPE_CHECKING)
    "F841",   # local-variable-unused
    "SIM102", # collapsible-if
    "SIM103", # needless-bool
    "SIM108", # if-else-to-if-exp
    "SIM110", # reimplemented-builtin
    "SIM114", # if-with-same-arms
    "SIM117", # multiple-with-statements
    "SIM118", # in-dict-keys
    "SIM300", # yoda-condition
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B"]               # loose patterns in tests
"**/__init__.py" = ["F401"]           # re-exports from package roots
"alembic/env.py" = ["F401", "I001"]           # SQLAlchemy model registry re-imports
"app/modules/*/schemas/page.py" = ["F401", "I001"]   # re-exports of shared page schemas
"app/modules/*/services/asset_service.py" = ["F401", "I001"]  # re-exports of shared asset service
"app/worker/dependabot/shared.py" = ["F401", "I001"]  # re-exported for monkeypatching in tests

sonar.projectKey=project-score-card
sonar.projectName=Project Scorecard

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=**/test_*.py,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.venv/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/.worktrees/**,\
  **/package-lock.json,\
  **/docs/plans/**,\
  **/seeds/**,\
  **/alembic/versions/**,\
  **/*.md

sonar.python.version=3.13
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.projectKey=project-score-card
sonar.projectName=Project Scorecard

sonar.sources=backend/app,frontend/src

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.venv/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/.worktrees/**,\
  **/package-lock.json,\
  **/docs/**,\
  **/seeds/**,\
  **/alembic/**,\
  **/*.md,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/test_*.py,\
  **/tests/**,\
  **/conftest.py,\
  infrastructure/**,\
  scripts/**,\
  .github/**

sonar.python.version=3.13
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml

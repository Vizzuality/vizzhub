name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  DB_USER: scorecard
  DB_PASSWORD: scorecard-ci
  DB_NAME: scorecard

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scorecard
          POSTGRES_PASSWORD: scorecard-ci
          POSTGRES_DB: scorecard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: '3.13'
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://scorecard:scorecard-ci@localhost:5432/scorecard
          TEST_DATABASE_URL: postgresql+asyncpg://scorecard:scorecard-ci@localhost:5432/scorecard
          DEBUG: "true"
        run: uv run pytest

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install and test
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # For OIDC
      contents: read    # For checkout
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7  # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/hub-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@4282e2b4f4018fbb1d76a177de8ce052de19b55e  # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Get Google Client ID from Secrets Manager
        id: google-oauth
        run: |
          GOOGLE_SECRET=$(aws secretsmanager get-secret-value --secret-id /hub/prod/google-oauth --query SecretString --output text)
          echo "client_id=$(echo $GOOGLE_SECRET | jq -r '.client_id')" >> $GITHUB_OUTPUT

      - name: Check existing images in ECR
        id: check-images
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          BACKEND_EXISTS=$(aws ecr describe-images --repository-name hub/backend --image-ids imageTag=${{ github.sha }} 2>/dev/null && echo "true" || echo "false")
          FRONTEND_EXISTS=$(aws ecr describe-images --repository-name hub/frontend --image-ids imageTag=${{ github.sha }} 2>/dev/null && echo "true" || echo "false")
          echo "backend_exists=$BACKEND_EXISTS" >> $GITHUB_OUTPUT
          echo "frontend_exists=$FRONTEND_EXISTS" >> $GITHUB_OUTPUT

      - name: Build and push backend
        if: steps.check-images.outputs.backend_exists == 'false'
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7
        with:
          context: .
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/hub/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        if: steps.check-images.outputs.frontend_exists == 'false'
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/hub/frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=https://hub.vizzuality.com
            VITE_GOOGLE_CLIENT_ID=${{ steps.google-oauth.outputs.client_id }}
            VITE_SENTRY_DSN=https://662c5ba925f28e9fc78657feb645a648@o4511123590086656.ingest.de.sentry.io/4511127174447184
            VITE_APP_ENV=production
            VITE_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: [backend-test, frontend-test, build-and-push]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write   # For OIDC
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7  # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/hub-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup EC2 environment
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["mkdir -p /opt/hub", "mkdir -p /usr/local/lib/docker/cli-plugins", "test -f /usr/local/lib/docker/cli-plugins/docker-compose || curl -sL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose", "chmod +x /usr/local/lib/docker/cli-plugins/docker-compose"]' \
            --query 'Command.CommandId' \
            --output text
          sleep 3

      - name: Upload docker-compose.prod.yml
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMPOSE_B64=$(base64 -w0 infrastructure/docker-compose.prod.yml)
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo '$COMPOSE_B64' | base64 -d > /opt/hub/docker-compose.prod.yml\"]" \
            --query 'Command.CommandId' \
            --output text
          sleep 3

      - name: Upload Alloy config
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          ALLOY_B64=$(base64 -w0 infrastructure/alloy-config.alloy)
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo '$ALLOY_B64' | base64 -d > /opt/hub/alloy-config.alloy\"]" \
            --query 'Command.CommandId' \
            --output text
          sleep 3

      - name: Create .env from Secrets Manager
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DOMAIN_NAME: hub.vizzuality.com
          TAG: ${{ github.sha }}
        run: |
          # Build the script to create .env
          ENV_SCRIPT=$(cat << 'SCRIPT'
          cd /opt/hub
          DB=$(aws secretsmanager get-secret-value --secret-id /hub/prod/db-password --query SecretString --output text --region AWS_REGION_PLACEHOLDER)
          JWT=$(aws secretsmanager get-secret-value --secret-id /hub/prod/jwt-secrets --query SecretString --output text --region AWS_REGION_PLACEHOLDER)
          GOOGLE=$(aws secretsmanager get-secret-value --secret-id /hub/prod/google-oauth --query SecretString --output text --region AWS_REGION_PLACEHOLDER)
          JIRA=$(aws secretsmanager get-secret-value --secret-id /hub/prod/jira-oauth --query SecretString --output text --region AWS_REGION_PLACEHOLDER)
          GRAFANA=$(aws secretsmanager get-secret-value --secret-id /hub/prod/grafana-cloud --query SecretString --output text --region AWS_REGION_PLACEHOLDER)
          MCP=$(aws secretsmanager get-secret-value --secret-id /hub/prod/mcp-oauth --query SecretString --output text --region AWS_REGION_PLACEHOLDER)
          cat > .env.alloy << EOF
          GRAFANA_API_TOKEN=$(echo $GRAFANA | jq -r '.api_token')
          GRAFANA_PROMETHEUS_USERNAME=$(echo $GRAFANA | jq -r '.prometheus_username')
          GRAFANA_PROMETHEUS_ENDPOINT=$(echo $GRAFANA | jq -r '.prometheus_endpoint')
          GRAFANA_LOKI_USERNAME=$(echo $GRAFANA | jq -r '.loki_username')
          GRAFANA_LOKI_ENDPOINT=$(echo $GRAFANA | jq -r '.loki_endpoint')
          EOF
          chmod 600 .env.alloy
          cat > .env << EOF
          DATABASE_URL=postgresql+asyncpg://$(echo $DB | jq -r '.username'):$(echo $DB | jq -r '.password')@$(echo $DB | jq -r '.host'):5432/$(echo $DB | jq -r '.dbname')
          JWT_SECRET_KEY=$(echo $JWT | jq -r '.jwt_secret_key')
          SESSION_SECRET_KEY=$(echo $JWT | jq -r '.session_secret_key')
          OAUTH_ENCRYPTION_KEY=$(echo $JWT | jq -r '.oauth_encryption_key')
          JWT_EXPIRE_HOURS=24
          GOOGLE_CLIENT_ID=$(echo $GOOGLE | jq -r '.client_id')
          GOOGLE_CLIENT_SECRET=$(echo $GOOGLE | jq -r '.client_secret')
          ALLOWED_GOOGLE_DOMAIN=vizzuality.com
          JIRA_OAUTH_CLIENT_ID=$(echo $JIRA | jq -r '.client_id')
          JIRA_OAUTH_CLIENT_SECRET=$(echo $JIRA | jq -r '.client_secret')
          JIRA_OAUTH_REDIRECT_URI=https://DOMAIN_PLACEHOLDER/api/oauth/jira/callback
          JIRA_OAUTH_SCOPES=read:jira-work read:jira-user offline_access
          DEBUG=false
          CORS_ORIGINS=["https://DOMAIN_PLACEHOLDER"]
          REDIS_HOST=redis
          REDIS_PORT=6379
          ASSETS_BUCKET_NAME=hub-vizzuality-assets
          ASSETS_BUCKET_URL=https://hub-vizzuality-assets.s3.eu-west-3.amazonaws.com
          PLAYBOOK_PUBLIC_URL=https://playbook.vizzuality.com
          PLAYBOOK_CLOUDFRONT_DISTRIBUTION_ID=E2B2DSEQB8J1K8
          SENTRY_DSN=https://0c204d934b8b93da862f16922f647e94@o4511123590086656.ingest.de.sentry.io/4511127154327632
          MCP_ENABLED=true
          MCP_BASE_URL=https://DOMAIN_PLACEHOLDER/mcp
          MCP_OAUTH_CLIENT_ID=$(echo $MCP | jq -r '.client_id')
          MCP_OAUTH_CLIENT_SECRET=$(echo $MCP | jq -r '.client_secret')
          LOG_FORMAT=json
          LOG_LEVEL=INFO
          APP_ENV=production
          RELEASE=TAG_PLACEHOLDER
          EOF
          chmod 600 .env
          SCRIPT
          )

          # Replace placeholders
          ENV_SCRIPT="${ENV_SCRIPT//AWS_REGION_PLACEHOLDER/${AWS_REGION}}"
          ENV_SCRIPT="${ENV_SCRIPT//DOMAIN_PLACEHOLDER/${DOMAIN_NAME}}"
          ENV_SCRIPT="${ENV_SCRIPT//TAG_PLACEHOLDER/${TAG}}"

          # Encode and send
          ENV_SCRIPT_B64=$(echo "$ENV_SCRIPT" | base64 -w0)

          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo '$ENV_SCRIPT_B64' | base64 -d | bash\"]" \
            --query 'Command.CommandId' \
            --output text

          sleep 3

      - name: Deploy containers
        env:
          TAG: ${{ github.sha }}
          ECR_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          # Build deploy script
          DEPLOY_SCRIPT=$(cat << 'SCRIPT'
          set -e
          cd /opt/hub
          export TAG=TAG_PLACEHOLDER
          export ECR_URI=ECR_PLACEHOLDER

          echo "=== ECR Login ==="
          aws ecr get-login-password --region REGION_PLACEHOLDER | docker login --username AWS --password-stdin $ECR_URI

          echo "=== Pulling images ==="
          docker compose -f docker-compose.prod.yml pull

          echo "=== Starting containers ==="
          docker compose -f docker-compose.prod.yml up -d --force-recreate

          echo "=== Waiting for backend to start (15s) ==="
          sleep 15

          echo "=== Health check ==="
          for i in 1 2 3 4 5; do
            if curl -sf http://localhost:8000/health/live; then
              echo "Backend healthy!"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "Backend unhealthy after 5 attempts"
              docker compose -f docker-compose.prod.yml logs --tail=100 backend
              exit 1
            fi
            echo "Attempt $i failed, waiting 10s..."
            sleep 10
          done

          echo "=== Container status ==="
          docker compose -f docker-compose.prod.yml ps

          echo "=== Cleanup old images ==="
          docker image prune -af --filter until=168h || true
          SCRIPT
          )

          # Replace placeholders
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//TAG_PLACEHOLDER/${TAG}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//ECR_PLACEHOLDER/${ECR_URI}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//REGION_PLACEHOLDER/${AWS_REGION}}"

          # Encode and send
          DEPLOY_SCRIPT_B64=$(echo "$DEPLOY_SCRIPT" | base64 -w0)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo '$DEPLOY_SCRIPT_B64' | base64 -d | bash\"]" \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
                exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text || true
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text || true
                exit 1 ;;
            esac
            sleep 10
          done
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "## Deployment Successful :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** production" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://hub.vizzuality.com" >> $GITHUB_STEP_SUMMARY

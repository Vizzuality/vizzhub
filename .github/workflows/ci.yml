name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:  # Allow this workflow to be called from deploy.yml

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ vars.DB_USER || 'test' }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD_CI }}
          POSTGRES_DB: ${{ vars.DB_NAME || 'test' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        id: coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://${{ vars.DB_USER || 'test' }}:${{ secrets.DB_PASSWORD_CI }}@localhost:5432/${{ vars.DB_NAME || 'test' }}
          DEBUG: "true"
        run: |
          pytest --cov=app --cov-report=term-missing | tee coverage.txt
          COVERAGE=$(grep "^TOTAL" coverage.txt | awk '{print $4}' | sed 's/%//')
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests with coverage
        id: coverage
        working-directory: frontend
        run: |
          npm test -- --run --coverage | tee coverage.txt
          COVERAGE=$(grep "All files" coverage.txt | awk '{print $4}' | head -1)
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  coverage-badge:
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Create coverage badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: coverage.json
          label: coverage
          message: "${{ needs.backend.outputs.coverage }}% | ${{ needs.frontend.outputs.coverage }}%"
          valColorRange: ${{ needs.backend.outputs.coverage }}
          maxColorRange: 100
          minColorRange: 0

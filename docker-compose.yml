# WARNING: This docker-compose.yml is for LOCAL DEVELOPMENT ONLY
# DO NOT use this configuration in production
# For production, use proper secrets management (AWS Secrets Manager, Vault, etc.)
# and environment-specific configuration files
#
# SETUP: Copy .env.docker.example to .env.docker and configure your values

version: '3.8'

services:
  db:
    env_file:
      - path: .env.docker
        required: false
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-scorecard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scorecard-ci}
      POSTGRES_DB: ${DB_NAME:-scorecard}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env.docker
        required: false
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-scorecard}:${DB_PASSWORD:-scorecard-ci}@db:5432/${DB_NAME:-scorecard}
      - DEBUG=${DEBUG:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env.docker
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-scorecard}:${DB_PASSWORD:-scorecard-ci}@db:5432/${DB_NAME:-scorecard}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.worker.settings.WorkerSettings
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

version: "1.0"

linter: qodana-python

profile:
  name: qodana.recommended

bootstrap: |
  set -e
  pip install --no-cache-dir -r backend/requirements.txt

exclude:
  - name: All
    paths:
      - backend/alembic
      - backend/tests
      - backend/seeds
      - frontend/src/shared/components/ui
      - frontend/node_modules
      - frontend/dist
      - frontend/build
      - frontend/coverage
      - infrastructure
      - scripts
      - docs
      - data
      - Support
      - temp
      - audits
      - mcp_server/tests
      - "**/__pycache__"
      - "**/.venv"
      - "**/venv"
      - "**/.worktrees"
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.spec.ts"
      - "**/*.spec.tsx"
      - "**/test_*.py"
      - "**/conftest.py"
